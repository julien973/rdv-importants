<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes RDV importants</title>
<style>
@property --surface-alpha { syntax: "<number>"; inherits: true; initial-value: 0.72; }
* { box-sizing: border-box; }
:root { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
body.day, body.night {
  --progress-grad: linear-gradient(90deg, #f06192, #fbbf24, #4ade80, #38bdf8, #a78bfa);
  --progress-glow: rgba(240, 97, 146, .6);
  --acc: #7c3aed; --acc-2: #a78bfa; --acc-soft: rgba(147, 90, 255, .14);
  --date-bg: linear-gradient(150deg, #8b5cf6, #6d28d9); --date-ink: #f5f2ff;
  --date-glow: 0 6px 18px rgba(124, 58, 237, .35);
}
body.night {
  --bg-base: #2b2860; --ink: #f0edfd; --muted: #b4b0e6;
  --bg-image:
    radial-gradient(ellipse 60% 42% at 20% 10%, rgba(178,120,255,.5), transparent 62%),
    radial-gradient(ellipse 50% 36% at 85% 20%, rgba(105,150,255,.55), transparent 62%),
    radial-gradient(ellipse 55% 40% at 78% 92%, rgba(200,130,255,.38), transparent 62%),
    radial-gradient(ellipse 45% 32% at 12% 88%, rgba(70,160,255,.42), transparent 60%),
    radial-gradient(ellipse 35% 26% at 50% 55%, rgba(80,120,255,.22), transparent 60%),
    linear-gradient(160deg, #342a6e 0%, #3a3580 50%, #2a2a63 100%);
  --surface: rgba(40,36,88,.64); --surface-kpi: rgba(46,42,96,.6);
  --card-border: rgba(200,200,255,.22); --border-strong: rgba(200,200,255,.5);
  --inner-light: inset 0 1px 0 rgba(255,255,255,.13);
  --btn-bg: rgba(200,200,255,.12); --btn-hover: rgba(200,200,255,.24); --btn-ink: #f0edfd; --btn-border: rgba(200,200,255,.4);
  --shadow-md: 0 2px 6px rgba(15,10,45,.28), 0 16px 40px rgba(15,10,45,.45);
  --halo: 0 0 0 1px rgba(200,200,255,.24), 0 14px 44px rgba(15,10,45,.5), 0 0 34px rgba(124,110,255,.34);
  --topbar-bg: rgba(36,32,80,.6); --topbar-border: rgba(200,200,255,.16);
  --badge-bg: rgba(200,200,255,.10); --badge-border: rgba(200,200,255,.28);
  --past-ink: rgba(240,237,253,.4); --spot: rgba(110,160,255,.2);
  --win-bar-grad: linear-gradient(90deg, #8b5cf6, #38bdf8);
}
body.day {
  --bg-base: #dbe4fc; --ink: #1a2040; --muted: #565e8c;
  --bg-image:
    radial-gradient(ellipse 55% 38% at 15% 10%, rgba(139,92,246,.5), transparent 62%),
    radial-gradient(ellipse 45% 32% at 88% 15%, rgba(59,130,246,.55), transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 90%, rgba(34,211,238,.34), transparent 62%),
    radial-gradient(ellipse 40% 28% at 10% 85%, rgba(217,70,239,.3), transparent 60%),
    radial-gradient(ellipse 32% 24% at 50% 50%, rgba(99,102,241,.24), transparent 60%),
    linear-gradient(160deg, #f2f5ff 0%, #d7e0fa 100%);
  --surface: rgba(255,255,255,.66); --surface-kpi: rgba(255,255,255,.6);
  --card-border: rgba(255,255,255,.95); --border-strong: rgba(26,32,64,.26);
  --inner-light: inset 0 1px 0 rgba(255,255,255,.95);
  --btn-bg: rgba(255,255,255,.6); --btn-hover: #ffffff; --btn-ink: #1a2040; --btn-border: rgba(26,32,64,.2);
  --shadow-md: 0 2px 6px rgba(59,80,180,.1), 0 16px 40px rgba(59,80,180,.2);
  --halo: 0 0 0 1px rgba(255,255,255,.95), 0 14px 44px rgba(59,80,180,.26), 0 0 34px rgba(99,102,241,.3);
  --topbar-bg: rgba(242,245,255,.7); --topbar-border: rgba(26,32,64,.08);
  --badge-bg: rgba(99,102,241,.08); --badge-border: rgba(99,102,241,.24);
  --past-ink: rgba(26,32,64,.36); --spot: rgba(99,102,241,.18);
  --win-bar-grad: linear-gradient(90deg, #8b5cf6, #38bdf8);
}
body { margin: 0; padding: 0 0 64px; min-height: 100vh; min-height: 100svh; overscroll-behavior-y: none;
  color: var(--ink); background-color: var(--bg-base); background-image: var(--bg-image);
  transition: background-color .45s ease, color .45s ease; }
@media (hover: hover) and (pointer: fine) { body { background-attachment: fixed; } }
.orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.orbs i { position: absolute; border-radius: 50%; filter: blur(64px); opacity: .7; }
.orbs .o1 { width: 380px; height: 380px; left: -100px; top: 6%; background: var(--acc-soft); }
.orbs .o2 { width: 300px; height: 300px; right: -80px; top: 36%; background: var(--spot); }
.orbs .o3 { width: 340px; height: 340px; left: 28%; bottom: -100px; background: var(--acc-soft); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--topbar-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--topbar-border); }
.topbar-inner { max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; gap: 12px; flex-wrap: wrap; }
.tb-brand { font-size: 1.05rem; letter-spacing: .3px; font-weight: 700; }
.tb-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.lang-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-ink); cursor: pointer;
  font-family: inherit; font-size: .92rem; transition: background .18s, transform .18s, box-shadow .18s; }
.lang-btn:hover { background: var(--btn-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.lang-btn.active { outline: 2px solid var(--acc-2); outline-offset: 1px; font-weight: 700; }
.flag { width: 21px; height: 14px; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.page { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 22px 18px 10px; }
.hero { background: var(--surface); border: 1px solid var(--card-border); border-radius: 20px;
  box-shadow: var(--shadow-md), var(--inner-light);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 26px 26px 22px; margin-top: 18px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: linear-gradient(90deg, var(--acc-2), var(--acc)); }
.hero h1 { margin: 0 0 8px; font-size: 1.65rem; }
.hero p { margin: 0; color: var(--muted); font-style: italic; }
.plan { background: var(--surface); border: 1px solid var(--card-border); border-radius: 20px;
  box-shadow: var(--shadow-md), var(--inner-light); padding: 18px 20px 14px; margin: 18px 0; position: relative; overflow: hidden; }
.plan::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--progress-grad); }
.plan-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; user-select: none; }
.plan-body { display: none; }
.plan.open .plan-body { display: block; }
.plan-chev { display: inline-block; transition: transform .2s; font-size: .8rem; }
.plan.open .plan-chev { transform: rotate(90deg); }
.plan-hint { color: var(--acc-2); font-weight: 700; font-size: .8rem; margin-left: 8px; }
.plan-title { font-size: 1.18rem; font-weight: 800; }
.plan-note { color: var(--muted); font-size: .78rem; margin-top: 3px; }
.plan-years { display: block; font-size: .82rem; font-weight: 800; color: var(--acc-2); letter-spacing: 1.2px; margin-top: 2px; }
.plan-track { margin-top: 14px; }
.plan-track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.plan-track-title { font-weight: 700; font-size: .95rem; }
.plan-track-count { color: var(--muted); font-size: .8rem; font-weight: 700; }
.plan-track-desc { color: var(--muted); font-size: .82rem; font-style: italic; margin: 2px 0 4px; }
.plan-bar { height: 6px; border-radius: 3px; background: var(--badge-bg); margin: 6px 0 6px; overflow: hidden; }
.plan-fill { height: 100%; border-radius: 3px; background: var(--win-bar-grad); }
.plan-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 1px 16px; }
.plan-mod { display: flex; align-items: center; gap: 8px; font-size: .85rem; padding: 3px 0; color: var(--muted); }
.plan-mod.clk { cursor: pointer; border-radius: 8px; padding: 3px 6px; margin: 0 -6px; transition: background .15s; }
.plan-mod.clk:hover { background: var(--badge-bg); }
.plan-chev { display: inline-block; transition: transform .2s; font-size: .7rem; }
.plan-mod.open .plan-chev { transform: rotate(90deg); }
.plan-lessons { display: none; grid-column: 1 / -1; margin: 2px 0 8px 17px; padding: 8px 14px;
  border-left: 2px solid var(--acc-2); background: var(--badge-bg); border-radius: 0 10px 10px 0; }
.plan-mod.open + .plan-lessons { display: block; }
.plan-les { font-size: .8rem; color: var(--muted); padding: 2px 0; display: flex; gap: 8px; align-items: baseline; }
.plan-les-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .45; flex: none; transform: translateY(-2px); }
.plan-les.done .plan-les-dot { background: var(--acc-2); opacity: 1; }
.plan-les.done span:last-child { color: var(--past-ink); }
.plan-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--acc-2); flex: none; }
.plan-mod.done { color: var(--past-ink); }
.plan-mod.done .plan-dot { background: var(--acc-2); border-color: var(--acc-2); }
.plan-mod .n { margin-left: auto; font-size: .72rem; opacity: .7; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 18px 0; }
.kpi { position: relative; overflow: hidden; background: var(--surface-kpi); border: 1px solid var(--card-border); border-radius: 18px;
  box-shadow: var(--shadow-md), var(--inner-light); padding: 16px 18px; text-align: center;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .18s, box-shadow .18s; }
.kpi::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--acc-2), var(--acc)); }
.win::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--acc-2), var(--acc)); }
.kpi:hover { transform: translateY(-3px); box-shadow: var(--halo); }
.kpi .label { font-size: .78rem; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); font-weight: 600; }
.kpi .value { font-size: 2rem; font-weight: 800; margin: 4px 0 2px;
  background: linear-gradient(135deg, #a78bfa, #7c3aed, #38bdf8);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.kpi .sub { font-size: .85rem; color: var(--muted); }
.section { margin: 26px 0; }
.section-title { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; margin: 0 0 14px; font-weight: 700; }
.section-title::after { content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--badge-border), transparent); }
.rdv { display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--card-border);
  border-radius: 18px; box-shadow: var(--shadow-md), var(--inner-light); padding: 16px 18px; margin-bottom: 12px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .2s, box-shadow .2s; align-items: stretch; position: relative; overflow: hidden; }
.rdv::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: linear-gradient(90deg, var(--acc-2), var(--acc)); }
.rdv:hover { transform: translateY(-3px) scale(1.005); box-shadow: var(--halo); }
.rdv-cat-sante { box-shadow: var(--shadow-md), var(--inner-light), 0 0 22px rgba(244,63,94,.28); }
.rdv-cat-travail::before { background: linear-gradient(90deg, #bbf7d0, #4ade80, #16a34a); filter: saturate(1.35) brightness(1.1); }
.rdv-cat-admin::before { background: linear-gradient(90deg, #fde68a, #f59e0b, #d97706); filter: saturate(1.3) brightness(1.08); }
.rdv-cat-sante::before { background: linear-gradient(90deg, #fda4af, #f43f5e, #e11d48);
  filter: saturate(1.4) brightness(1.15); box-shadow: 0 0 16px rgba(244,63,94,.9), 0 0 42px rgba(244,63,94,.55); }
.rdv.rdv-cat-sante:hover { box-shadow: var(--halo), 0 0 26px rgba(244,63,94,.4); }
.rdv.past { opacity: .55; filter: saturate(.4); }
.rdv.cancelled { opacity: .75; filter: saturate(.35); position: relative; }
.rdv.cancelled .rdv-title, .rdv.cancelled .rdv-desc, .rdv.cancelled .rdv-where { text-decoration: line-through; text-decoration-thickness: 1px; }
.stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-22deg);
  border: 3px solid #ef4444; color: #ef4444; font-weight: 900; font-size: 1.6rem; letter-spacing: .18em;
  padding: 4px 18px; border-radius: 6px; opacity: .5; pointer-events: none; text-transform: uppercase; z-index: 2;
  box-shadow: 0 0 0 1px rgba(239,68,68,.25) inset; background: rgba(239,68,68,.06); }
.rdv-date { flex: 0 0 74px; background: var(--date-bg); color: var(--date-ink); border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px;
  box-shadow: var(--date-glow), inset 0 1px 0 rgba(255,255,255,.35); }
.rdv-date .d { font-size: 1.75rem; font-weight: 800; line-height: 1; }
.rdv-date .m { font-size: .74rem; text-transform: uppercase; letter-spacing: 1.6px; margin-top: 3px; font-weight: 600; }
.rdv-body { flex: 1; min-width: 0; }
.rdv-title { font-size: 1.06rem; font-weight: 700; margin-bottom: 3px; }
.rdv.past .rdv-title, .rdv.past .rdv-where { color: var(--past-ink); }
.rdv-where { color: var(--muted); font-size: .9rem; margin-bottom: 9px; }
.rdv-desc { color: var(--muted); font-size: .84rem; margin: -5px 0 9px; font-style: italic; }
.rdv-meta { display: flex; flex-wrap: wrap; gap: 7px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; padding: 4px 11px; font-weight: 600;
  border-radius: 999px; background: var(--badge-bg); border: 1px solid var(--badge-border);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.badge.soon { border-color: var(--acc-2); color: var(--acc-2); font-weight: 700;
  box-shadow: 0 0 12px rgba(147,90,255,.25); }
.badge.done { opacity: .8; }
.badge.cat { border-color: currentColor; color: var(--acc-2); }
.rdv-cat-sante .badge.cat { color: #f43f5e; }
.rdv-cat-travail .badge.cat { color: #16a34a; }
.rdv-cat-admin .badge.cat { color: #d97706; }
.win { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--card-border); border-radius: 18px;
  box-shadow: var(--shadow-md), var(--inner-light); padding: 18px 20px; margin-bottom: 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .2s, box-shadow .2s; }
.win:hover { transform: translateY(-3px); box-shadow: var(--halo); }
.win-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.win-title { font-size: 1.06rem; font-weight: 700; }
.win-sub { color: var(--muted); font-size: .9rem; margin: 6px 0 10px; }
.win-bar { height: 9px; border-radius: 999px; background: var(--badge-bg); border: 1px solid var(--badge-border); overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.12); }
.win-bar i { display: block; height: 100%; background: var(--win-bar-grad); border-radius: 999px;
  box-shadow: 0 0 10px rgba(124,58,237,.4); }
.botbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--topbar-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--topbar-border); }
.botbar-inner { max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; gap: 12px; flex-wrap: wrap; font-size: .9rem; }
.bb-link { color: var(--ink); text-decoration: none; padding: 5px 12px; border-radius: 999px; font-weight: 600;
  border: 1px solid var(--btn-border); background: var(--btn-bg); transition: background .18s, transform .18s; }
.bb-link:hover { background: var(--btn-hover); transform: translateY(-1px); }
.bb-ver { color: var(--muted); }
#progress { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0%; background: var(--progress-grad);
  border-radius: 999px; transition: width .18s linear; box-shadow: var(--progress-glow);
  filter: saturate(1.3) brightness(1.12); will-change: width; }
@media (max-width: 520px) { .rdv { flex-direction: column; } .rdv-date { flex-direction: row; gap: 8px; }
  .hero h1 { font-size: 1.3rem; } }

/* ===== v4 REFONTE STRUCTURELLE (aperçu 5) ===== */
@keyframes orbFloat { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(36px,-26px) scale(1.1); } }
.orbs i { animation: orbFloat 16s ease-in-out infinite alternate; will-change: transform; }
.orbs .o2 { animation-duration: 21s; animation-direction: alternate-reverse; }
.orbs .o3 { animation-duration: 26s; animation-delay: -6s; }
@media (prefers-reduced-motion: reduce) { .orbs i { animation: none; } }
.topbar { position: sticky; }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent 4%, var(--acc-2) 30%, #38bdf8 55%, var(--acc-2) 75%, transparent 96%);
  opacity: .55; box-shadow: 0 0 12px rgba(124,110,255,.4); }
.tb-brand { font-size: 1.1rem; letter-spacing: .5px;
  background: linear-gradient(95deg, #a78bfa, #38bdf8);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero { border-radius: 24px; padding: 30px 28px 26px; border-color: var(--border-strong);
  box-shadow: var(--halo), var(--inner-light); }
.hero::before { inset: 0 auto 0 0; width: 4px; height: 100%;
  background: linear-gradient(180deg, #a78bfa, #7c3aed 55%, #38bdf8);
  box-shadow: 0 0 18px rgba(124,58,237,.6); }
.hero h1 { font-size: 1.95rem; letter-spacing: .3px;
  background: linear-gradient(110deg, var(--ink) 25%, #a78bfa 60%, #38bdf8 90%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.kpis { gap: 16px; }
.kpi { border-radius: 20px; text-align: left; padding: 18px 20px 16px 24px; border-color: var(--border-strong); }
.kpi::after { inset: 0 auto 0 0; width: 4px; height: 100%;
  background: linear-gradient(180deg, #a78bfa, #38bdf8);
  box-shadow: 0 0 16px rgba(124,110,255,.5); }
.kpi .value { font-size: 2.55rem; margin: 6px 0 2px;
  background: linear-gradient(130deg, #a78bfa, #7c3aed 55%, #38bdf8);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.kpi .label { letter-spacing: 1.8px; }
.section-title { font-size: 1.28rem;
  background: linear-gradient(100deg, var(--ink) 55%, #a78bfa 78%, #38bdf8);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.rdv { border-radius: 20px; padding: 18px 20px 16px 24px; }
.rdv::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
  background: linear-gradient(180deg, var(--acc-2), var(--acc));
  box-shadow: 0 0 14px rgba(124,58,237,.5); }
.rdv-cat-travail::after { background: linear-gradient(180deg, #bbf7d0, #16a34a); box-shadow: 0 0 14px rgba(74,222,128,.55); }
.rdv-cat-admin::after { background: linear-gradient(180deg, #fde68a, #d97706); box-shadow: 0 0 14px rgba(245,158,11,.55); }
.rdv-cat-sante::after { background: linear-gradient(180deg, #fda4af, #e11d48); box-shadow: 0 0 14px rgba(244,63,94,.6); }
.rdv-date { flex: 0 0 84px; border-radius: 16px;
  box-shadow: var(--date-glow), inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 1px rgba(255,255,255,.15); }
.rdv-date .d { font-size: 2rem; }
.badge.soon { background: var(--acc-soft); box-shadow: 0 0 16px rgba(147,90,255,.35); }
.plan { border-radius: 24px; }
@media (max-width: 520px) { .hero h1 { font-size: 1.5rem; } .kpi { padding: 16px 18px 14px 22px; } }
/* ===== v4 APERÇU 6 — cartes néon encastrées, badges de bord, fonds cosmos+ville ===== */

function dayDiffMid(d){ var t = new Date(); t.setHours(0,0,0,0); var x = new Date(d); x.setHours(0,0,0,0); return Math.round((x - t) / 86400000); }
