<!DOCTYPE html>
<html lang="fr" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RDV récurrents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100svh;color:var(--txt);background:var(--bg1);background-image:var(--bgimg);background-attachment:scroll;transition:color .3s}
:root,[data-theme="day"]{
--txt:#2e1065;--sub:#6d5b9e;--bg1:#eef2ff;--card:rgba(255,255,255,.62);--bord:rgba(255,255,255,.85);--shad:0 8px 32px rgba(109,76,162,.18);--acc:#7c3aed;--accsoft:rgba(124,58,237,.12);--badge:rgba(124,58,237,.14);
--bgimg:radial-gradient(60rem 40rem at 10% -10%,rgba(244,114,182,.28),transparent 60%),radial-gradient(50rem 35rem at 90% 0%,rgba(56,189,248,.25),transparent 60%),radial-gradient(55rem 40rem at 50% 110%,rgba(167,139,250,.30),transparent 60%),linear-gradient(180deg,#eef2ff,#f5f3ff 50%,#ede9fe)}
[data-theme="night"]{
--txt:#ede9fe;--sub:#b9aed6;--bg1:#171129;--card:rgba(255,255,255,.08);--bord:rgba(255,255,255,.16);--shad:0 10px 36px rgba(0,0,0,.45);--acc:#a78bfa;--accsoft:rgba(167,139,250,.16);--badge:rgba(167,139,250,.18);
--bgimg:radial-gradient(60rem 40rem at 15% -10%,rgba(244,114,182,.20),transparent 60%),radial-gradient(50rem 35rem at 85% 5%,rgba(56,189,248,.16),transparent 60%),radial-gradient(60rem 45rem at 50% 115%,rgba(167,139,250,.22),transparent 60%),linear-gradient(180deg,#171129,#241a3e 55%,#1a1240)}
.filament{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#f06192,#fbbf24,#4ade80,#38bdf8,#a78bfa);box-shadow:0 0 14px 3px rgba(167,139,250,.75);z-index:999;border-radius:0 3px 3px 0}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:var(--card);border-bottom:1px solid var(--bord);padding:.8rem 1.2rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
h1{font-size:1.15rem;font-weight:800;letter-spacing:.02em}
.controls{display:flex;gap:.5rem;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--bord);background:var(--card);color:var(--txt);padding:.35rem .7rem;border-radius:999px;backdrop-filter:blur(8px);box-shadow:var(--shad);transition:transform .15s}
button:hover{transform:translateY(-2px)}
.flag{font-size:1.15rem;padding:.3rem .5rem}
main{max-width:880px;margin:0 auto;padding:1.2rem 1rem 2.5rem}
.stats{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0 1.6rem}
.stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:.8rem 1rem;box-shadow:var(--shad);backdrop-filter:blur(10px)}
.stat b{display:block;font-size:1.5rem;background:linear-gradient(90deg,#f06192,#fbbf24,#4ade80,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:.78rem;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
h2{margin:1.6rem 0 .8rem;font-size:1.02rem;text-transform:uppercase;letter-spacing:.09em;color:var(--sub);display:flex;align-items:center;gap:.5rem}
h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bord),transparent)}
.cards{display:grid;gap:.9rem;perspective:1100px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bord);border-radius:18px;padding:1rem 1.1rem;box-shadow:var(--shad);backdrop-filter:blur(12px);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px) rotateX(2deg);box-shadow:0 16px 42px rgba(109,76,162,.28)}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.30) 50%,transparent 70%);pointer-events:none}
[data-theme="night"] .card::after{background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%)}
.card .top{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.card .ttl{font-weight:700;font-size:1.02rem}
.card .date{font-weight:800;color:var(--acc);font-size:.92rem;white-space:nowrap}
.card .meta{margin-top:.35rem;font-size:.85rem;color:var(--sub)}
.badge{display:inline-block;margin-top:.5rem;font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:var(--badge);color:var(--acc)}
.cd{margin-top:.5rem;font-weight:800;font-size:.9rem}
.card.past{opacity:.55}
.card.past .ttl{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--acc)}
footer{position:sticky;bottom:0;z-index:50;display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center;padding:.6rem 1.2rem;background:var(--card);border-top:1px solid var(--bord);backdrop-filter:blur(14px);font-size:.8rem;color:var(--sub)}
footer a{color:var(--acc);text-decoration:none;font-weight:700}
.ver{font-weight:800}
@media(max-width:560px){h1{font-size:1rem}main{padding:1rem .7rem 2rem}}
</style>
<script>try{var t=localStorage.getItem("THEMEKEY")||"day";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div class="filament" id="fil"></div>
<header>
<h1 id="htitle" data-fr="🔄 RDV récurrents" data-en="🔄 Recurring dates">🔄 RDV récurrents</h1>
<div class="controls">
<button class="flag" id="btn-fr" title="Français">🇫🇷 FR</button>
<button class="flag" id="btn-en" title="English">🇬🇧 EN</button>
<button id="btn-theme">🌙 Nuit</button>
</div>
</header>
<main>
<div id="list"></div>
</main>
<footer>
<a href="index.html" data-fr="→ RDV importants" data-en="→ Important appointments">→ RDV importants</a>
<span class="ver">v3.2 · 2026</span>
</footer>
</body>
</html>
<script>
window.addEventListener("scroll",function(){var h=document.documentElement;var p=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;document.getElementById("fil").style.width=p+"%"},{passive:true});
var LK="rec-lang",TK="rec-theme";
function lang(){try{return localStorage.getItem(LK)||"fr"}catch(e){return"fr"}}
function setLang(l){try{localStorage.setItem(LK,l)}catch(e){}applyLang(l)}
function applyLang(l){document.documentElement.lang=l;document.querySelectorAll("[data-fr]").forEach(function(el){el.textContent=l==="fr"?el.dataset.fr:el.dataset.en});var t=document.getElementById("btn-theme");if(t)t.textContent=l==="fr"?"🌙 Nuit":"🌙 Night";var d=document.getElementById("btn-en"),f=document.getElementById("btn-fr");if(d)d.style.opacity=l==="en"?"1":".55";if(f)f.style.opacity=l==="fr"?"1":".55"}
document.getElementById("btn-fr").onclick=function(){setLang("fr")};
document.getElementById("btn-en").onclick=function(){setLang("en")};
document.getElementById("btn-theme").onclick=function(){var cur=document.documentElement.getAttribute("data-theme")==="night"?"day":"night";document.documentElement.setAttribute("data-theme",cur);try{localStorage.setItem(TK,cur)}catch(e){}};
applyLang(lang());
var BIRTHDAYS=[{"n":"Sébastien","m":9,"d":26},{"n":"Niva","m":10,"d":12},{"n":"Kon","m":11,"d":5},{"n":"Kiana","m":11,"d":12},{"n":"Nat & Mika","m":12,"d":25},{"n":"Nicre","m":1,"d":23},{"n":"Julien","m":2,"d":23}];
var WINDOWS=[{"fr":"Actualisation de septembre","en":"September renewal","o":[9,28],"c":[10,15]},{"fr":"Actualisation d’octobre","en":"October renewal","o":[10,28],"c":[11,15]},{"fr":"Actualisation de novembre","en":"November renewal","o":[11,28],"c":[12,15]},{"fr":"Actualisation de décembre","en":"December renewal","o":[12,28],"c":[1,15]}];
function fmtD(iso,l){var d=new Date(iso);var M=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];var Me=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];var J=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];var Je=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var mo=l==='fr'?M:Me,js=l==='fr'?J:Je;return js[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()]}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function nextOcc(m,d){var now=new Date(),y=now.getFullYear();var t=new Date(y,m-1,d);if(t<new Date(y,now.getMonth(),now.getDate()))t=new Date(y+1,m-1,d);return t}
function winDate(ymd){var y=ymd[0]===1?2027:2026;return new Date(y,ymd[0]-1,ymd[1])}
var MO={fr:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],en:["January","February","March","April","May","June","July","August","September","October","November","December"]};
function render(){var l=lang(),now=new Date(),html="";
  html+='<h2>🎂 '+(l==="fr"?"Anniversaires":"Birthdays")+'</h2><div class="cards">';
  BIRTHDAYS.slice().sort(function(a,b){return nextOcc(a.m,a.d)-nextOcc(b.m,b.d)}).forEach(function(b){var t=nextOcc(b.m,b.d),days=Math.ceil((t-now)/864e5);
    var cd=days===0?"C’est aujourd’hui ! 🎉":(days===1?"Demain !":"Dans "+days+" jours");
    if(l!=="fr"){cd=days===0?"It’s today! 🎉":(days===1?"Tomorrow!":"In "+days+" days")}
    html+='<div class="card"><div class="top"><span class="ttl">🎂 '+esc(b.n)+'</span><span class="date">'+b.d+" "+MO[l][b.m-1]+'</span></div><div class="cd">⏳ '+cd+'</div></div>'});
  html+='</div><h2>🔄 '+(l==="fr"?"Fenêtres d’actualisation":"Renewal windows")+'</h2><div class="cards">';
  WINDOWS.forEach(function(w){var o=winDate(w.o),c=winDate(w.c);
    var state=now<o?"soon":(now<=c?"open":"over");
    var lbl=state==="soon"?(l==="fr"?"Ouvre le":"Opens on"):state==="open"?(l==="fr"?"Ouverte jusqu’au":"Open until"):(l==="fr"?"Terminée":"Closed");
    var oTxt=(w.o[0]===1?2027:2026)+"-"+("0"+w.o[0]).slice(-2)+"-"+("0"+w.o[1]).slice(-2)+"T00:00:00";
    var cTxt=(w.c[0]===1?2027:2026)+"-"+("0"+w.c[0]).slice(-2)+"-"+("0"+w.c[1]).slice(-2)+"T00:00:00";
    html+='<div class="card'+(state==="over"?" past":"")+'"><div class="top"><span class="ttl">'+esc(l==="fr"?w.fr:w.en)+'</span></div><div class="meta">'+lbl+" "+fmtD(oTxt,l)+" → "+fmtD(cTxt,l)+'</div>'+(state==="open"?'<span class="badge">🟢 Ouverte</span>':state==="over"?'<span class="badge">✓ Terminée</span>':"")+'</div>'});
  html+='</div>';document.getElementById("list").innerHTML=html;applyLang(lang())}
render();setInterval(render,60000);
</script>
