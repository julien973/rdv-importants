  .botbar a{color:var(--muted);text-decoration:none;font-weight:600}
  .botbar a:hover{color:var(--accent)}

  @media(max-width:560px){.stat .val{font-size:1.2rem}.card{padding:13px 14px}}

    $('btnFR').classList.toggle('active', LANG==='fr');
    $('btnEN').classList.toggle('active', LANG==='en');
    if (typeof render === 'function') render();
  }
  function setLang(l){ LANG=l; localStorage.setItem('rdv-lang', l); applyLang(); }
  function setTheme(t){ document.body.classList.toggle('night', t==='night'); document.body.classList.toggle('day', t!=='night'); localStorage.setItem('rdv-theme', t); $('btnTheme').textContent = t==='night'?'☀️':'🌙'; }
  const $ = id => document.getElementById(id);
  $('btnFR').onclick = ()=>setLang('fr');
  $('btnEN').onclick = ()=>setLang('en');
  $('btnTheme').onclick = ()=>setTheme(document.body.classList.contains('night')?'day':'night');
  
  const NOW = new Date();

  const BD = [{"ic":"🎂","md":"10-12","fr":"Anniversaire de Niva","en":"Niva's birthday"},{"ic":"🎂","md":"11-05","fr":"Anniversaire de Kon","en":"Kon's birthday"},{"ic":"🎂","md":"11-12","fr":"Anniversaire de Kiana","en":"Kiana's birthday"},{"ic":"🎂","md":"12-16","fr":"Anniversaire de Leeloo","en":"Leeloo's birthday"},{"ic":"🎂","md":"12-25","fr":"Anniversaire de Nat & Mika","en":"Nat & Mika's birthday"},{"ic":"🎂","md":"01-23","fr":"Anniversaire de Nicre","en":"Nicre's birthday"},{"ic":"🎂","md":"02-23","fr":"Mon anniversaire (Julien)","en":"My birthday (Julien)"}];

  function nextOcc(md){
    let y = NOW.getFullYear();
    let d = new Date(y+'-'+md+'T00:00:00');
    if (d < NOW) d = new Date((y+1)+'-'+md+'T00:00:00');
    return d;
  }
  function render(){
    let h = '<h2><span class="n">🎂</span>'+ (LANG==='fr'?'Anniversaires':'Birthdays') +'</h2>';

  }
  applyLang();
  
</script>
