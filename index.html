<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes RDV importants</title>
<style>
* { box-sizing: border-box; }
:root { font-family: Georgia, "Times New Roman", serif; }
body.day, body.night { --acc: #b4552d; --acc-soft: rgba(180,85,45,.12); }
body.night {
  --bg-base: #161009; --ink: #f3e9d8; --muted: #b8a88e;
  --bg-image: radial-gradient(ellipse 80% 60% at 12% 6%, rgba(180,85,45,.22), transparent 60%),
    radial-gradient(ellipse 70% 55% at 90% 14%, rgba(120,80,30,.20), transparent 60%),
    radial-gradient(ellipse 85% 70% at 85% 95%, rgba(90,60,25,.18), transparent 62%),
    linear-gradient(160deg, #17110a 0%, #241a10 50%, #191009 100%);
  --surface: rgba(38,26,15,.78); --card-border: rgba(255,240,215,.22); --border-strong: rgba(255,240,215,.45);
  --date-bg: linear-gradient(150deg, #b4552d, #8a3c1c); --date-ink: #fff6e8;
  --btn-bg: rgba(255,240,215,.12); --btn-hover: rgba(255,240,215,.24); --btn-ink: #f3e9d8; --btn-border: rgba(255,240,215,.4);
  --shadow-md: 0 8px 32px rgba(0,0,0,.45);
  --halo: 0 0 0 1px rgba(255,240,215,.22), 0 14px 44px rgba(0,0,0,.55), 0 0 30px rgba(180,85,45,.18);
  --topbar-bg: rgba(26,18,10,.66); --topbar-border: rgba(255,240,215,.16);
  --badge-bg: rgba(255,240,215,.10); --badge-border: rgba(255,240,215,.28);
  --past-ink: rgba(243,233,216,.38); --spot: rgba(255,235,200,.14);
  --progress-grad: linear-gradient(90deg, #f0c75e, #d9a441, #f5d489, #d9a441);
  --progress-glow: 0 0 12px rgba(217,164,65,.6);
}
body.day {
  --bg-base: #faf6ef; --ink: #2f2822; --muted: #7c6f5f;
  --bg-image: radial-gradient(ellipse 80% 60% at 12% 6%, rgba(180,85,45,.06), transparent 60%),
    radial-gradient(ellipse 70% 55% at 90% 14%, rgba(194,101,58,.06), transparent 60%),
    radial-gradient(ellipse 85% 70% at 85% 95%, rgba(150,110,60,.07), transparent 62%),
    linear-gradient(160deg, #fdfaf4 0%, #faf4e9 55%, #f7efdf 100%);
  --surface: rgba(255,255,255,.72); --card-border: rgba(255,255,255,.95); --border-strong: rgba(45,32,19,.3);
  --date-bg: linear-gradient(150deg, #c2653a, #9c4a22); --date-ink: #fff8ec;
  --btn-bg: rgba(255,255,255,.65); --btn-hover: #ffffff; --btn-ink: #2f2822; --btn-border: rgba(45,32,19,.25);
  --shadow-md: 0 2px 6px rgba(28,25,23,.05), 0 14px 36px rgba(28,25,23,.1);
  --halo: 0 0 0 1px rgba(255,255,255,.95), 0 12px 32px rgba(28,25,23,.12), 0 0 22px rgba(180,85,45,.12);
  --topbar-bg: rgba(250,246,239,.72); --topbar-border: rgba(45,32,19,.1);
  --badge-bg: rgba(180,85,45,.07); --badge-border: rgba(180,85,45,.22);
  --past-ink: rgba(45,32,19,.35); --spot: rgba(180,85,45,.06);
  --progress-grad: linear-gradient(90deg, #fbbf24, #d97706, #b3453e);
  --progress-glow: 0 0 10px rgba(217,119,6,.55);
}
body { margin: 0; padding: 0 0 64px; min-height: 100vh; min-height: 100svh; overscroll-behavior-y: none;
  color: var(--ink); background-color: var(--bg-base); background-image: var(--bg-image);
  transition: background-color .45s ease, color .45s ease; }
@media (hover: hover) and (pointer: fine) { body { background-attachment: fixed; } }
.orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.orbs i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; }
.orbs .o1 { width: 340px; height: 340px; left: -80px; top: 8%; background: var(--acc-soft); }
.orbs .o2 { width: 260px; height: 260px; right: -60px; top: 34%; background: var(--acc-soft); }
.orbs .o3 { width: 300px; height: 300px; left: 30%; bottom: -90px; background: var(--spot); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--topbar-bg);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--topbar-border); }
.topbar-inner { max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; gap: 12px; flex-wrap: wrap; }
.tb-brand { font-size: 1.05rem; letter-spacing: .3px; font-weight: bold; }
.tb-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.lang-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-ink); cursor: pointer;
  font-family: inherit; font-size: .92rem; transition: background .18s, transform .18s; }
.lang-btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
.lang-btn.active { outline: 2px solid var(--acc); outline-offset: 1px; font-weight: bold; }
.flag { width: 21px; height: 14px; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.page { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 22px 18px 10px; }
.hero { background: var(--surface); border: 1px solid var(--card-border); border-radius: 18px;
  box-shadow: var(--shadow-md); padding: 26px 26px 22px; margin-top: 18px; }
.hero h1 { margin: 0 0 8px; font-size: 1.65rem; }
.hero p { margin: 0; color: var(--muted); font-style: italic; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 18px 0; }
.kpi { background: var(--surface); border: 1px solid var(--card-border); border-radius: 16px;
  box-shadow: var(--shadow-md); padding: 16px 18px; text-align: center; }
.kpi .label { font-size: .82rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
.kpi .value { font-size: 1.9rem; font-weight: bold; margin: 4px 0 2px; color: var(--acc); }
.kpi .sub { font-size: .85rem; color: var(--muted); }
.section { margin: 26px 0; }
.section-title { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; margin: 0 0 14px; }
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--badge-border); }
.rdv { display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--card-border);
  border-radius: 16px; box-shadow: var(--shadow-md); padding: 16px 18px; margin-bottom: 12px;
  transition: transform .18s, box-shadow .18s; align-items: stretch; }
.rdv:hover { transform: translateY(-2px); box-shadow: var(--halo); }
.rdv.past { opacity: .55; filter: saturate(.4); }
.rdv-date { flex: 0 0 74px; background: var(--date-bg); color: var(--date-ink); border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; }
.rdv-date .d { font-size: 1.7rem; font-weight: bold; line-height: 1; }
.rdv-date .m { font-size: .8rem; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 3px; }
.rdv-body { flex: 1; min-width: 0; }
.rdv-title { font-size: 1.08rem; font-weight: bold; margin-bottom: 3px; }
.rdv.past .rdv-title, .rdv.past .rdv-where { color: var(--past-ink); }
.rdv-where { color: var(--muted); font-size: .92rem; margin-bottom: 8px; }
.rdv-meta { display: flex; flex-wrap: wrap; gap: 7px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; padding: 4px 10px;
  border-radius: 999px; background: var(--badge-bg); border: 1px solid var(--badge-border);
  font-family: Georgia, serif; }
.badge.soon { border-color: var(--acc); color: var(--acc); font-weight: bold; }
.badge.done { opacity: .8; }
.win { background: var(--surface); border: 1px solid var(--card-border); border-radius: 16px;
  box-shadow: var(--shadow-md); padding: 18px 20px; margin-bottom: 14px; }
.win-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.win-title { font-size: 1.08rem; font-weight: bold; }
.win-sub { color: var(--muted); font-size: .92rem; margin: 6px 0 10px; }
.win-bar { height: 8px; border-radius: 999px; background: var(--badge-bg); border: 1px solid var(--badge-border); overflow: hidden; }
.win-bar i { display: block; height: 100%; background: linear-gradient(90deg, #6b7d3f, #8a9a55); }
.botbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--topbar-bg);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--topbar-border); }
.botbar-inner { max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; gap: 12px; flex-wrap: wrap; font-size: .9rem; }
.bb-link { color: var(--ink); text-decoration: none; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--btn-border); background: var(--btn-bg); transition: background .18s; }
.bb-link:hover { background: var(--btn-hover); }
.bb-ver { color: var(--muted); }
#progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0%; background: var(--progress-grad);
  border-radius: 999px; transition: width .18s linear; box-shadow: var(--progress-glow); }
@media (max-width: 520px) { .rdv { flex-direction: column; } .rdv-date { flex-direction: row; gap: 8px; }
  .hero h1 { font-size: 1.3rem; } }
</style>
</head>
<body class="night">
<script>try{if(localStorage.getItem("rdv-theme")==="day")document.body.className="day";}catch(e){}</script>
<div class="orbs" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div>
<header class="topbar"><div class="topbar-inner">
<span class="tb-brand" data-fr="📓 Mes RDV importants" data-en="📓 My Appointments">📓 Mes RDV importants</span>
<div class="tb-actions">
<button class="lang-btn active" id="btn-fr" onclick="switchLang('fr')"><svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#ffffff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>FR</button>
<button class="lang-btn" id="btn-en" onclick="switchLang('en')"><svg class="flag" viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/><path d="M30,0 V30 M0,15 H60" stroke="#ffffff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3.5"/></svg>EN</button>
<button class="lang-btn" id="btn-theme" onclick="toggleTheme()"><span id="btn-theme-ico">☀️</span> <span data-fr="Thème" data-en="Theme">Thème</span></button>
</div></div><i id="progress" aria-hidden="true"></i></header>
<main class="page">
<div id="app"></div>
</main>
<footer class="botbar"><div class="botbar-inner">
<span data-fr="📓 Mes RDV importants" data-en="📓 My Appointments">📓 Mes RDV importants</span>
<span class="bb-ver">v2.2 · 2026</span>
<a class="bb-link" href="recurrents.html" data-fr="🔄 Récurrents" data-en="🔄 Recurring">🔄 Récurrents</a>
</div></footer>
<script>
(function(){
"use strict";
var THEME_KEY = "rdv-theme"; var LANG_KEY = "rdv-lang";
var lang = "fr"; try { lang = localStorage.getItem(LANG_KEY) || "fr"; } catch(e) {}
window.switchLang = function(l){ lang = l; try { localStorage.setItem(LANG_KEY, l); } catch(e) {} syncLang(); render(); };
function syncLang(){
  document.getElementById("btn-fr").classList.toggle("active", lang === "fr");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-fr]").forEach(function(s){ s.textContent = lang === "fr" ? s.getAttribute("data-fr") : s.getAttribute("data-en"); });
}
window.setTheme = function(t){
  document.body.classList.toggle("night", t === "night");
  document.body.classList.toggle("day", t === "day");
  document.getElementById("btn-theme-ico").textContent = t === "day" ? "🌙" : "☀️";
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
};
window.toggleTheme = function(){ setTheme(document.body.classList.contains("day") ? "night" : "day"); };
window.addEventListener("scroll", function(){
  var h = document.documentElement;
  var p = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
  document.getElementById("progress").style.width = p + "%";
}, { passive: true });
var EVENTS = [
  { cat:"sante", start:"2026-09-22T10:00", end:null,
    fr:"Appeler le cabinet du Dr Poulaliou (dermatologue)", en:"Call Dr Poulaliou's office (dermatologist)",
    whereFr:"Appel téléphonique", whereEn:"Phone call" },
  { cat:"travail", start:"2026-09-22T17:50", end:"2026-09-22T23:00",
    fr:"Mission inventaire — Carrefour Paimpol", en:"Inventory mission — Carrefour Paimpol",
    whereFr:"B2 Parking Agence, 11 Rue Alexis Clairaut, Brest", whereEn:"B2 Parking Agence, 11 Rue Alexis Clairaut, Brest" },
  { cat:"admin", start:"2026-09-23T15:00", end:"2026-09-23T16:00",
    fr:"Entretien RSA — bilan fin CEU", en:"RSA interview — end-of-CEU review",
    whereFr:"CDAS Bellevue, 13 Napoléon III, Brest", whereEn:"CDAS Bellevue, 13 Napoléon III, Brest" },
  { cat:"travail", start:"2026-09-28T20:00", end:"2026-09-29T01:00",
    fr:"Mission inventaire — Leclerc Infomil", en:"Inventory mission — Leclerc Infomil",
    whereFr:"Route du Leck, Landerneau", whereEn:"Route du Leck, Landerneau" },
  { cat:"travail", start:"2026-10-09T20:30", end:"2026-10-10T01:30",
    fr:"Mission inventaire — Carrefour Plouzané", en:"Inventory mission — Carrefour Plouzané",
    whereFr:"12 Rue des Myosotis, Plouzané", whereEn:"12 Rue des Myosotis, Plouzané" }
];
var CATS = [
  { id:"sante", icon:"📞", fr:"Santé", en:"Health" },
  { id:"travail", icon:"🏢", fr:"Travail", en:"Work" },
  { id:"admin", icon:"🏛️", fr:"Administratif", en:"Admin" }
];
var MOIS_FR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var JOURS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var DAYS_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function parse(d){ return new Date(d); }
function dayDiff(d){ var t = new Date(); t.setHours(0,0,0,0); var x = new Date(d); x.setHours(0,0,0,0); return Math.round((x - t) / 86400000); }
function fmtTime(d){ var h = d.getHours(), m = d.getMinutes(); return (h < 10 ? "0" : "") + h + "h" + (m < 10 ? "0" : "") + m; }
function render(){
  var fr = lang === "fr";
  var upcoming = 0, past = 0, next = null;
  EVENTS.forEach(function(e){ var d = dayDiff(e.start); if (d >= 0) { upcoming++; if (next === null || d < next) next = d; } else past++; });
  var h = "";
  h += '<div class="hero"><h1>' + (fr ? "🗓️ Mon agenda des rendez-vous" : "🗓️ My appointment diary") + '</h1>';
  h += '<p>' + (fr ? "Les rendez-vous importants, rien d'autre." : "Important appointments, nothing else.") + '</p></div>';
  h += '<div class="kpis">';
  h += '<div class="kpi"><div class="label">' + (fr ? "À venir" : "Upcoming") + '</div><div class="value">' + upcoming + '</div><div class="sub">' + (fr ? "rendez-vous planifiés" : "scheduled appointments") + '</div></div>';
  h += '<div class="kpi"><div class="label">' + (fr ? "Prochain dans" : "Next in") + '</div><div class="value">' + (next === null ? "—" : next + " j") + '</div><div class="sub">' + (next === 0 ? (fr ? "aujourd'hui !" : "today!") : (fr ? "jours" : "days")) + '</div></div>';
  h += '<div class="kpi"><div class="label">' + (fr ? "Passés" : "Past") + '</div><div class="value">' + past + '</div><div class="sub">' + (fr ? "archivés grisés" : "grayed out") + '</div></div>';
  h += '</div>';
  CATS.forEach(function(cat){
    var list = EVENTS.filter(function(e){ return e.cat === cat.id; })
                      .sort(function(a,b){ return parse(a.start) - parse(b.start); });
    if (!list.length) return;
    h += '<section class="section"><h2 class="section-title">' + cat.icon + " " + esc(fr ? cat.fr : cat.en) + '</h2>';
    list.forEach(function(e){
      var d = parse(e.start);
      var diff = dayDiff(e.start);
      var isPast = diff < 0;
      var day = d.getDate();
      var month = fr ? MOIS_FR[d.getMonth()] : MONTHS_EN[d.getMonth()];
      var fullDate = (fr ? JOURS_FR[d.getDay()] : DAYS_EN[d.getDay()]) + " " + day + " " + month + " " + d.getFullYear();
      var t = fmtTime(d) + (e.end ? " – " + fmtTime(parse(e.end)) : "");
      var count = "";
      if (isPast) count = '<span class="badge done">✓ ' + (fr ? "Passé" : "Past") + '</span>';
      else if (diff === 0) count = '<span class="badge soon">🔥 ' + (fr ? "Aujourd'hui !" : "Today!") + '</span>';
      else if (diff === 1) count = '<span class="badge soon">⏳ ' + (fr ? "Demain" : "Tomorrow") + '</span>';
      else count = '<span class="badge">⏳ ' + (fr ? "Dans " + diff + " jours" : "In " + diff + " days") + '</span>';
      h += '<article class="rdv' + (isPast ? " past" : "") + '">';
      h += '<div class="rdv-date"><div class="d">' + day + '</div><div class="m">' + month + '</div></div>';
      h += '<div class="rdv-body"><div class="rdv-title">' + esc(fr ? e.fr : e.en) + '</div>';
      h += '<div class="rdv-where">📍 ' + esc(fr ? e.whereFr : e.whereEn) + '</div>';
      h += '<div class="rdv-meta"><span class="badge">🕐 <b>' + t + '</b></span>' + count + '<span class="badge">📅 ' + fullDate + '</span></div>';
      h += '</div></article>';
    });
    h += '</section>';
  });
  document.getElementById("app").innerHTML = h;
}
syncLang(); render();
})();
</script>
</body>
</html>
